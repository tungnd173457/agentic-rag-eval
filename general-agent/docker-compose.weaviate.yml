# Weaviate LOCAL cho eval — BYO vector (không cần module vectorizer).
# Chạy:  docker compose -f docker-compose.weaviate.yml up -d
# HTTP: localhost:8080  |  gRPC: localhost:50051  (khớp eval/bootstrap.py)
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_bench_data:/var/lib/weaviate
    restart: unless-stopped

volumes:
  weaviate_bench_data:
